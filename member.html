<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ijin Pengajian (Anggota)</title>
  <!-- Masukkan script face-api.js -->
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, textarea, button { width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box; }
    .btn-scan { background: #17a2b8; color: white; border: none; border-radius: 5px; }
    .btn-submit { background: #28a745; color: white; border: none; border-radius: 5px; font-weight: bold; }
    #videoMember { width: 100%; max-width: 300px; border-radius: 10px; display: none; margin: 0 auto 15px auto; }
  </style>
</head>
<body>
  <h2>Formulir Ijin Tidak Hadir</h2>

  <button type="button" class="btn-scan" onclick="bukaKameraIjin()">📷 Isi Nama Otomatis (Scan Wajah)</button>
  
  <div style="text-align: center;">
    <video id="videoMember" autoplay muted playsinline></video>
    <p id="statusScan" style="color: blue; font-weight: bold;"></p>
  </div>

  <form id="formIjin">
    <label>Tanggal Ijin:</label>
    <input type="date" id="tglIjin" required>

    <label>ID Anggota:</label>
    <input type="text" id="idAnggota" placeholder="Ketik manual atau gunakan scan wajah..." required>

    <label>Nama Lengkap:</label>
    <input type="text" id="namaAnggota" placeholder="Ketik manual atau gunakan scan wajah..." required>

    <label>Alasan Ijin:</label>
    <textarea id="alasanIjin" rows="3" placeholder="Sakit, acara keluarga, dll..." required></textarea>

    <button type="submit" class="btn-submit">Kirim Ijin Pengajian</button>
  </form>

  <script>
    const SCRIPT_URL = 'MASUKKAN_URL_WEB_APP_ANDA_DISINI';
    let faceMatcher;

    // 1. Muat model face-api saat halaman dibuka (dari folder /models di github)
    async function loadModels() {
      await faceapi.nets.ssdMobilenetv1.loadFromUri('./models');
      await faceapi.nets.faceLandmark68Net.loadFromUri('./models');
      await faceapi.nets.faceRecognitionNet.loadFromUri('./models');
      
      const res = await fetch(SCRIPT_URL + '?action=getDescriptors');
      const members = await res.json();
      const labeledDescriptors = members.map(m => {
        return new faceapi.LabeledFaceDescriptors(m.nama + '||' + m.id, [new Float32Array(Object.values(m.descriptor))]);
      });
      faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.5);
    }
    loadModels();

    // 2. Fungsi Tombol Scan Wajah
    async function bukaKameraIjin() {
      if(!faceMatcher) { alert("Model AI masih memuat, tunggu sebentar..."); return; }
      
      const video = document.getElementById('videoMember');
      video.style.display = 'block';
      document.getElementById('statusScan').innerText = 'Menunggu kamera & mencari wajah...';
      
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
      video.srcObject = stream;
      
      const scanInterval = setInterval(async () => {
        const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
        
        if (detection) {
          const match = faceMatcher.findBestMatch(detection.descriptor);
          if (match.label !== 'unknown') {
            const [nama, id] = match.label.split('||');
            
            // Isi form otomatis
            document.getElementById('idAnggota').value = id;
            document.getElementById('namaAnggota').value = nama;
            document.getElementById('statusScan').innerText = `✅ Wajah dikenali: ${nama}`;
            
            // Matikan kamera
            clearInterval(scanInterval);
            stream.getTracks().forEach(track => track.stop());
            video.style.display = 'none';
          }
        }
      }, 1000); // Scan tiap 1 detik
    }

    // 3. Proses Submit Form ke Spreadsheet
    document.getElementById('formIjin').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Ubah format tanggal YYYY-MM-DD ke DD/MM/YYYY agar seragam di spreadsheet
      const rawDate = document.getElementById('tglIjin').value.split('-');
      const formattedDate = `${rawDate[2]}/${rawDate[1]}/${rawDate[0]}`;
      
      const data = {
        action: 'submitIjin',
        tanggal: formattedDate, 
        id_anggota: document.getElementById('idAnggota').value,
        nama: document.getElementById('namaAnggota').value,
        alasan: document.getElementById('alasanIjin').value
      };
      
      const submitBtn = document.querySelector('.btn-submit');
      submitBtn.innerText = 'Mengirim ke Server...';
      submitBtn.disabled = true;
      
      await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(data)
      });
      
      alert('Ijin berhasil dikirim!');
      document.getElementById('formIjin').reset();
      document.getElementById('statusScan').innerText = '';
      submitBtn.innerText = 'Kirim Ijin Pengajian';
      submitBtn.disabled = false;
    });
  </script>
</body>
</html>
