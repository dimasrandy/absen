<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Pengajian</title>
  
  <!-- MEMUAT FACE-API SECARA LOKAL DARI REPO ANDA SENDIRI -->
  <script src="face-api.min.js"></script>

  <style>
    body { font-family: sans-serif; padding: 10px; }
    .menu-btn { padding: 15px; margin: 5px 0; font-size: 16px; width: 100%; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    .menu-btn:hover { background: #0056b3; }
    .section { display: none; padding: 15px; border: 1px solid #ccc; margin-top: 10px; border-radius: 5px;}
    .active { display: block; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
    #video-container {
      position: relative;
      display: inline-block;
      margin-top: 10px;
    }
    video {
      border: 3px solid #28a745;
      border-radius: 8px;
      background-color: #000;
      display: block;
    }
  </style>
</head>
<body>
  <h2>Menu Admin Masjid</h2>
  <!-- 4 Tombol Menu Utama -->
  <button class="menu-btn" onclick="showSection('absen')">1. Absensi Kamera</button>
  <button class="menu-btn" onclick="showSection('ubah')">2. Ubah Data Anggota</button>
  <button class="menu-btn" onclick="showSection('tambah')">3. Tambah Anggota (Kamera)</button>
  <button class="menu-btn" onclick="showSection('rekap')">4. Rekap & Peringkat Absen</button>

  <!-- Halaman 1: Absensi Kamera -->
  <div id="absen" class="section active">
    <h3>Mode Absensi Berjalan...</h3>
    <p id="model-status"><i>Memeriksa sistem...</i></p>
    <div id="video-container">
      <video id="video" width="640" height="480" autoplay muted></video>
    </div>
  </div>

  <!-- Halaman 2: Ubah Data Anggota -->
  <div id="ubah" class="section">
    <h3>Ubah Data Anggota</h3>
    <p><i>Fitur sedang disiapkan...</i></p>
  </div>

  <!-- Halaman 3: Tambah Anggota -->
  <div id="tambah" class="section">
    <h3>Tambah Anggota (Kamera)</h3>
    <p><i>Fitur sedang disiapkan...</i></p>
  </div>

  <!-- Halaman 4: Rekap Absen -->
  <div id="rekap" class="section">
    <h3>Peringkat Kehadiran Anggota</h3>
    <p>Sortir berdasarkan Tanggal:</p>
    Dari: <input type="date" id="startDate"><br><br>
    Sampai: <input type="date" id="endDate"><br><br>
    <button onclick="loadRekap()" style="padding:10px; background:#28a745; color:white; border:none; cursor:pointer;">Tampilkan Data</button>
    
    <div id="hasilRekap" style="margin-top: 20px;"></div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwBMjMP0fXaejwfplELxG4d0bNxlpBj_mQlwdDrOlMNTNetarn1Wd0Z6mM5OaEVJ0AQ/exec';
    const video = document.getElementById('video');
    let isModelLoaded = false;

    async function loadModels() {
      const status = document.getElementById('model-status');
      try {
        // Cek apakah face-api berhasil dibaca
        if (typeof faceapi === 'undefined') {
          throw new Error('File face-api.min.js lokal gagal dimuat.');
        }

        status.innerHTML = '<i>Memuat model AI (SSD Mobilenet)...</i>';
        await faceapi.nets.ssdMobilenetv1.loadFromUri('./models');

        status.innerHTML = '<i>Memuat model AI (Face Landmark)...</i>';
        await faceapi.nets.faceLandmark68Net.loadFromUri('./models');

        status.innerHTML = '<i>Memuat model AI (Face Recognition)...</i>';
        await faceapi.nets.faceRecognitionNet.loadFromUri('./models');
        
        isModelLoaded = true;
        status.innerHTML = '<b style="color: green;">Model AI berhasil dimuat! Mengaktifkan kamera...</b>';
        startCamera();
      } catch (error) {
        console.error("GAGAL MEMUAT MODEL:", error);
        status.innerHTML = '<b style="color: red;">Gagal memuat model AI.<br><br>' + error.message + '</b>';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadModels();
    });

    function showSection(id) {
      document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
      const targetSection = document.getElementById(id);
      if (targetSection) {
        targetSection.classList.add('active');
      }

      if (id === 'absen' && isModelLoaded && !video.srcObject) {
        startCamera();
      }
    }

    function startCamera() {
      navigator.mediaDevices.getUserMedia({ video: {} })
        .then(stream => {
          video.srcObject = stream;
        })
        .catch(err => {
          console.error("Kamera tidak dapat diakses:", err);
          alert("Izin kamera ditolak atau perangkat tidak mendeteksi kamera.");
        });
    }

    video.addEventListener('play', () => {
      const canvas = faceapi.createCanvasFromMedia(video);
      document.getElementById('video-container').append(canvas);
      
      const displaySize = { width: video.width, height: video.height };
      faceapi.matchDimensions(canvas, displaySize);

      setInterval(async () => {
        const detections = await faceapi.detectAllFaces(video, new faceapi.SsdMobilenetv1Options())
          .withFaceLandmarks()
          .withFaceDescriptors();
          
        const resizedDetections = faceapi.resizeResults(detections, displaySize);
        
        canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
        faceapi.draw.drawDetections(canvas, resizedDetections);
      }, 100);
    });

    async function loadRekap() {
      document.getElementById('hasilRekap').innerHTML = '<i>Sedang memuat data dari Spreadsheet...</i>';
      
      const startInput = document.getElementById('startDate').value;
      const endInput = document.getElementById('endDate').value;
      const start = new Date(startInput);
      const end = new Date(endInput);
      
      const res = await fetch(SCRIPT_URL + '?action=getRekap');
      const data = await res.json();
      
      const records = data.slice(1);
      let rekap = {}; 
      
      records.forEach(row => {
        const tglStr = row[0].split('/'); 
        const tglRow = new Date(tglStr[2], tglStr[1] - 1, tglStr[0]); 
        
        if (tglRow >= start && tglRow <= end) {
          const id = row[2];
          const nama = row[3];
          const status = row[4];
          const alasan = row[5];
          
          if (!rekap[id]) rekap[id] = { nama: nama, hadir: 0, ijin: 0, catatanIjin: [] };
          
          if (status === 'Hadir') rekap[id].hadir++;
          if (status === 'Ijin') {
            rekap[id].ijin++;
            rekap[id].catatanIjin.push(`${row[0]}: ${alasan}`);
          }
        }
      });
      
      let sortedRekap = Object.values(rekap).sort((a, b) => a.hadir - b.hadir);
      
      let html = `<table>
                    <tr>
                      <th>Peringkat (Jarang Hadir)</th>
                      <th>Nama</th>
                      <th>Total Hadir</th>
                      <th>Total Ijin</th>
                      <th>Alasan Ijin</th>
                    </tr>`;
                    
      sortedRekap.forEach((item, index) => {
        html += `<tr>
          <td>#${index + 1}</td>
          <td><b>${item.nama}</b></td>
          <td>${item.hadir} Hari</td>
          <td>${item.ijin} Hari</td>
          <td style="font-size:12px;">${item.catatanIjin.join('<br>')}</td>
        </tr>`;
      });
      html += `</table>`;
      
      document.getElementById('hasilRekap').innerHTML = html;
    }
  </script>
</body>
</html>
